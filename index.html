<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLBB Studio | Premium Collage Maker</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Libraries for Export and Drag-Drop -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    
    <style>
        :root {
            --bg: #0b0a1a;
            --surface: #16122b;
            --accent: #7d5fff;
            --accent-glow: rgba(125, 95, 255, 0.4);
            --border: rgba(255, 255, 255, 0.1);
            --glass: rgba(255, 255, 255, 0.03);
            --text: #ffffff;
            --text-dim: #a0a4cb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: 'Poppins', sans-serif; 
            background-image: radial-gradient(circle at 0% 0%, #1a1535 0%, transparent 50%),
                              radial-gradient(circle at 100% 100%, #110d24 0%, transparent 50%);
        }

        /* --- LAYOUT --- */
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        header { text-align: center; padding: 40px 0; }
        .logo { font-family: 'Orbitron', sans-serif; font-size: 2rem; color: var(--accent); letter-spacing: 4px; text-transform: uppercase; text-shadow: 0 0 20px var(--accent-glow); }

        /* --- DISPLAY BOXES --- */
        .workspace {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 40px;
            background: var(--glass);
            padding: 25px;
            border-radius: 24px;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }

        .upload-box {
            width: 100%;
            height: 250px;
            border: 2px dashed var(--border);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            background: rgba(0,0,0,0.2);
            transition: 0.3s;
        }
        .upload-box:hover { border-color: var(--accent); background: rgba(125, 95, 255, 0.05); }
        .upload-box img { width: 100%; height: 100%; object-fit: contain; z-index: 2; position: relative; }
        .box-label { position: absolute; text-align: center; color: var(--text-dim); font-size: 0.9rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

        .collage-box {
            width: 100%;
            min-height: 300px;
            background: #050505;
            border-radius: 15px;
            padding: 15px;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            position: relative;
        }

        .collage-item { aspect-ratio: 1/1.4; border-radius: 4px; overflow: hidden; background: #111; }
        .collage-item img { width: 100%; height: 100%; object-fit: cover; }

        /* --- CONTROLS --- */
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        #searchBar { flex: 1; background: var(--surface); border: 1px solid var(--border); padding: 15px; border-radius: 12px; color: white; outline: none; }
        .btn-export { background: var(--accent); color: white; border: none; padding: 0 30px; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-export:hover { transform: scale(1.05); box-shadow: 0 0 20px var(--accent-glow); }

        /* --- LIBRARY GRID --- */
        .library-title { margin-bottom: 20px; font-family: 'Orbitron'; font-size: 1rem; color: var(--text-dim); }
        .skin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }

        .skin-card {
            background: var(--surface);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: 0.3s;
            position: relative;
        }
        .skin-card:hover { transform: translateY(-5px); border-color: var(--accent); }
        .skin-card.selected { border: 2px solid var(--accent); }
        .skin-card img { width: 100%; height: 180px; object-fit: cover; }
        
        .skin-info {
            padding: 8px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            position: absolute;
            bottom: 0; width: 100%;
            text-align: center;
        }
        .hero-name { font-size: 0.75rem; font-weight: 600; display: block; }
        .tag-badge { font-size: 0.6rem; text-transform: uppercase; color: var(--accent); font-weight: bold; }

        #status { text-align: center; color: var(--accent); padding: 20px; }

        @media (max-width: 768px) {
            .collage-box { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo">MLBB Studio</div>
        </header>

        <!-- Final Product Display Area -->
        <div class="workspace" id="capture-area">
            <!-- Box 1: Account Screenshot -->
            <div class="upload-box" onclick="document.getElementById('profileInput').click()">
                <div class="box-label">MLBB Account Screenshot Goes Here<br><small>(Click to Upload)</small></div>
                <img id="profilePreview" src="">
                <input type="file" id="profileInput" hidden accept="image/*">
            </div>

            <!-- Box 2: Skin Collage Product -->
            <div class="collage-box" id="collage-output">
                <div class="box-label" id="collage-hint">MLBB Skin Collage Goes Here<br><small>(Select skins from library below)</small></div>
                <!-- Selected Skins will inject here -->
            </div>
        </div>

        <!-- Toolbar -->
        <div class="controls">
            <input type="text" id="searchBar" placeholder="Search Hero, Rarity (Legend, Collector, KOF)...">
            <button class="btn-export" onclick="downloadProduct()">Export PNG</button>
        </div>

        <!-- Library Section -->
        <div class="library-title">Skin Library</div>
        <div id="status">Connecting to GitHub Repo...</div>
        <div class="skin-grid" id="skinGrid"></div>
    </div>

    <script>
        // CONFIGURATION (Matches your Repo)
        const username = "alongbots";
        const repo = "Collage";
        const folder = "images";
        
        let allSkins = [];
        let selectedIds = [];

        // 1. FETCH FROM GITHUB
        async function fetchSkins() {
            const grid = document.getElementById('skinGrid');
            const status = document.getElementById('status');

            try {
                const response = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/${folder}`);
                if (!response.ok) throw new Error("Repo not found or Private");
                
                const files = await response.json();
                
                allSkins = files.filter(f => f.name.match(/\.(jpg|jpeg|png|webp)$/i)).map(file => {
                    const nameParts = file.name.split('.')[0].split('_');
                    return {
                        id: file.sha,
                        url: file.download_url,
                        tag: nameParts[0] || 'Basic',
                        hero: (nameParts[1] || 'Hero').replace(/-/g, ' '),
                        skinName: (nameParts[2] || '').replace(/-/g, ' '),
                        fileName: file.name.toLowerCase()
                    };
                });

                status.style.display = 'none';
                renderLibrary();

            } catch (err) {
                status.innerHTML = `Error: ${err.message}. Check if your GitHub Repo is Public.`;
            }
        }

        // 2. RENDER LIBRARY
        function renderLibrary() {
            const grid = document.getElementById('skinGrid');
            const term = document.getElementById('searchBar').value.toLowerCase();
            grid.innerHTML = '';

            const filtered = allSkins.filter(s => s.fileName.includes(term));

            filtered.forEach(skin => {
                const isSelected = selectedIds.includes(skin.id);
                const card = document.createElement('div');
                card.className = `skin-card ${isSelected ? 'selected' : ''}`;
                card.innerHTML = `
                    <img src="${skin.url}" loading="lazy">
                    <div class="skin-info">
                        <span class="hero-name">${skin.hero}</span>
                        <span class="tag-badge">${skin.tag}</span>
                    </div>
                `;
                card.onclick = () => toggleSkin(skin.id);
                grid.appendChild(card);
            });
        }

        // 3. SELECTION LOGIC
        function toggleSkin(id) {
            if (selectedIds.includes(id)) {
                selectedIds = selectedIds.filter(i => i !== id);
            } else {
                selectedIds.push(id);
            }
            renderLibrary();
            updateCollage();
        }

        // 4. UPDATE COLLAGE BOX
        function updateCollage() {
            const output = document.getElementById('collage-output');
            const hint = document.getElementById('collage-hint');
            
            output.querySelectorAll('.collage-item').forEach(el => el.remove());
            
            if (selectedIds.length > 0) {
                hint.style.display = 'none';
                selectedIds.forEach(id => {
                    const skin = allSkins.find(s => s.id === id);
                    const item = document.createElement('div');
                    item.className = 'collage-item';
                    item.innerHTML = `<img src="${skin.url}">`;
                    output.appendChild(item);
                });
            } else {
                hint.style.display = 'block';
            }
        }

        // 5. PROFILE UPLOAD
        document.getElementById('profileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    document.getElementById('profilePreview').src = event.target.result;
                    document.querySelector('.upload-box .box-label').style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        });

        // 6. EXPORT FINAL PRODUCT
        async function downloadProduct() {
            const area = document.getElementById('capture-area');
            const btn = document.querySelector('.btn-export');
            btn.innerText = "Processing...";

            const canvas = await html2canvas(area, {
                backgroundColor: '#0b0a1a',
                scale: 2, // Double resolution for high quality
                useCORS: true
            });

            const link = document.createElement('a');
            link.download = `MLBB-Studio-Product-${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            btn.innerText = "Export PNG";
        }

        // SEARCH LISTENER
        document.getElementById('searchBar').addEventListener('input', renderLibrary);

        // INIT
        fetchSkins();
    </script>
</body>
</html>
