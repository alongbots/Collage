<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLBB Skin Inventory</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05070a;
            --card-bg: #11141d;
            --legend: #ffcc00;
            --collector: #00f2ff;
            --epic: #d644ff;
            --special: #ff8c00;
            --elite: #2196f3;
            --starlight: #f48fb1;
            --default: #ffffff;
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 20px;
            background-image: radial-gradient(circle at top right, #1a1a2e, transparent);
        }

        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 30px;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            background: linear-gradient(to right, #00d2ff, #9d00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        .category-row {
            margin-bottom: 50px;
        }

        .row-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .row-title::after {
            content: "";
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, currentColor, transparent);
            opacity: 0.3;
        }

        .skin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 20px;
        }

        .skin-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .skin-card:hover {
            transform: translateY(-10px);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        .img-wrap {
            width: 100%;
            height: 240px;
            overflow: hidden;
            background: #000;
        }

        .img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.5s;
        }

        .skin-card:hover img {
            transform: scale(1.1);
        }

        .skin-info {
            padding: 12px;
            text-align: center;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            position: absolute;
            bottom: 0;
            width: 100%;
            box-sizing: border-box;
        }

        .hero-name {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 4px;
            text-shadow: 0 2px 4px black;
        }

        .tag-label {
            font-size: 0.6rem;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 3px;
            text-transform: uppercase;
            border: 1px solid;
            background: rgba(0,0,0,0.5);
        }

        /* Color Coding */
        .Legend { color: var(--legend); }
        .Collector { color: var(--collector); }
        .Epic { color: var(--epic); }
        .Special { color: var(--special); }
        .Elite { color: var(--elite); }
        .Starlight { color: var(--starlight); }
        .Normal { color: var(--default); }
    </style>
</head>
<body>

    <header>
        <h1>Skin Inventory</h1>
    </header>

    <div id="main-container"></div>

    <!-- THIS LOADS YOUR DATA -->
    <script src="skin.js"></script>

    <script>
        const container = document.getElementById('main-container');
        const groups = {};

        // 1. Organize images from skin.js into groups
        images.forEach(file => {
            const parts = file.split('_');
            const tag = parts[0] || "Normal";
            let name = parts[1] ? parts[1].split('.')[0] : "Hero";
            name = name.replace(/-/g, ' '); 

            if (!groups[tag]) groups[tag] = [];
            groups[tag].push({ file, name, tag });
        });

        // 2. Define row order
        const priority = ['Legend', 'Collector', 'Epic', 'Special', 'Elite', 'Starlight'];
        const sortedTags = Object.keys(groups).sort((a, b) => {
            let idxA = priority.indexOf(a);
            let idxB = priority.indexOf(b);
            return (idxA === -1 ? 99 : idxA) - (idxB === -1 ? 99 : idxB);
        });

        // 3. Build the UI
        sortedTags.forEach(tag => {
            const section = document.createElement('div');
            section.className = 'category-row';
            
            section.innerHTML = `
                <div class="row-title ${tag}">${tag} Skins</div>
                <div class="skin-grid" id="grid-${tag}"></div>
            `;
            container.appendChild(section);

            const grid = document.getElementById(`grid-${tag}`);
            groups[tag].forEach(item => {
                grid.innerHTML += `
                    <div class="skin-card">
                        <div class="img-wrap">
                            <img src="images/${item.file}" alt="${item.name}" loading="lazy">
                        </div>
                        <div class="skin-info">
                            <span class="hero-name">${item.name}</span>
                            <span class="tag-label ${tag}">${item.tag}</span>
                        </div>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
