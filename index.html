<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLBB Skin Inventory</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05070a;
            --panel: #11141d;
            --legend: #ffcc00;
            --collector: #00f2ff;
            --epic: #d644ff;
            --special: #ff8c00;
            --elite: #2196f3;
            --starlight: #f48fb1;
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 0;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            letter-spacing: 5px;
            background: linear-gradient(90deg, #00d2ff, #9d00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .category-row { margin-bottom: 50px; }

        .row-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            text-transform: uppercase;
        }

        .row-title::after {
            content: "";
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, currentColor, transparent);
            opacity: 0.2;
        }

        .skin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .skin-card {
            background: var(--panel);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .skin-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.8);
            border-color: rgba(255,255,255,0.2);
        }

        .img-box {
            width: 100%;
            height: 260px;
            background: #000;
        }

        .img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .skin-info {
            padding: 12px;
            text-align: center;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            position: absolute;
            bottom: 0;
            width: 100%;
        }

        .hero-name {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 5px;
            text-shadow: 0 2px 4px black;
        }

        .tag-badge {
            font-size: 0.6rem;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            border: 1px solid;
        }

        /* Color Coding */
        .Legend { color: var(--legend); }
        .Collector { color: var(--collector); }
        .Epic { color: var(--epic); }
        .Special { color: var(--special); }
        .Elite { color: var(--elite); }
        .Starlight { color: var(--starlight); }
    </style>
</head>
<body>

    <header>
        <h1>Hero Skins</h1>
    </header>

    <div id="main-container"></div>

    <script>
        async function fetchSkins() {
            try {
                // FETCH FROM THE "images" FILE
                const response = await fetch('images');
                const text = await response.text();
                const lines = text.split(/\r?\n/); // Split by lines

                const groups = {};

                lines.forEach(line => {
                    const file = line.trim();
                    if (!file) return;

                    const parts = file.split('_');
                    const tag = parts[0] || "Normal";
                    let name = parts[1] ? parts[1].split('.')[0] : "Hero";
                    name = name.replace(/-/g, ' ');

                    if (!groups[tag]) groups[tag] = [];
                    groups[tag].push({ file, name, tag });
                });

                renderUI(groups);
            } catch (err) {
                console.error("Error fetching images file:", err);
            }
        }

        function renderUI(groups) {
            const container = document.getElementById('main-container');
            const priority = ['Legend', 'Collector', 'Epic', 'Special', 'Elite', 'Starlight'];
            
            const sortedTags = Object.keys(groups).sort((a, b) => {
                let idxA = priority.indexOf(a);
                let idxB = priority.indexOf(b);
                return (idxA === -1 ? 99 : idxA) - (idxB === -1 ? 99 : idxB);
            });

            sortedTags.forEach(tag => {
                const section = document.createElement('div');
                section.className = 'category-row';
                section.innerHTML = `
                    <div class="row-title ${tag}">${tag} Skins</div>
                    <div class="skin-grid" id="grid-${tag}"></div>
                `;
                container.appendChild(section);

                const grid = document.getElementById(`grid-${tag}`);
                groups[tag].forEach(item => {
                    grid.innerHTML += `
                        <div class="skin-card">
                            <div class="img-box">
                                <img src="images/${item.file}" alt="${item.name}">
                            </div>
                            <div class="skin-info">
                                <span class="hero-name">${item.name}</span>
                                <span class="tag-badge ${tag}">${item.tag}</span>
                            </div>
                        </div>
                    `;
                });
            });
        }

        fetchSkins();
    </script>
</body>
</html>
